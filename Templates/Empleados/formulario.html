<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Empleado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow">
        <div class="card-body p-4">
            <h4 th:text="${empleado.id == null ? 'Nuevo Empleado' : 'Editar Empleado'}"></h4>
            
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:object="${empleado}" method="post" 
                  th:action="${empleado.id == null} ? @{/empleados/guardar} : @{/empleados/{id}/actualizar(id=${empleado.id})}">
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nombre Completo</label>
                        <input type="text" th:field="*{nombre}" class="form-control" th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{nombre}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Cédula (9 dígitos)</label>
                        <input type="text" th:field="*{cedula}" class="form-control" th:classappend="${#fields.hasErrors('cedula')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{cedula}"></div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" th:field="*{email}" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Puesto</label>
                        <select th:field="*{puesto}" class="form-select" th:classappend="${#fields.hasErrors('puesto')} ? 'is-invalid'">
                            <option value="">Seleccione...</option>
                            <option th:each="p : ${puestos}" th:value="${p}" th:text="${p.etiqueta}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{puesto}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Salario</label>
                        <input type="number" step="0.01" th:field="*{salario}" class="form-control" th:classappend="${#fields.hasErrors('salario')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{salario}"></div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Fecha de Ingreso</label>
                        <input type="date" th:field="*{fechaIngreso}" class="form-control" th:classappend="${#fields.hasErrors('fechaIngreso')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{fechaIngreso}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Departamento</label>
                        <select th:field="*{departamento}" class="form-select" th:classappend="${#fields.hasErrors('departamento')} ? 'is-invalid'">
                            <option value="">Seleccione...</option>
                            <option th:each="d : ${departamentos}" th:value="${d.id}" th:text="${d.nombre}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{departamento}"></div>
                    </div>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a th:href="@{/empleados}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Empleados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand">Empleados</span>
        <div>
            <a th:href="@{/}" class="btn btn-outline-light btn-sm">Inicio</a>
            <a th:href="@{/departamentos}" class="btn btn-outline-light btn-sm">Departamentos</a>
            <form th:action="@{/logout}" method="post" class="d-inline"><button class="btn btn-danger btn-sm">Salir</button></form>
        </div>
    </nav>

    <div class="container mt-4">
        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="d-flex justify-content-between mb-3">
            <h3>Lista de Empleados</h3>
            
            <div class="d-flex gap-2">
                <!-- Filtro por departamento -->
                <form th:action="@{/empleados}" method="get">
                    <select name="departamentoId" class="form-select" onchange="this.form.submit()">
                        <option value="">Todos los departamentos</option>
                        <option th:each="d : ${departamentos}" th:value="${d.id}" th:text="${d.nombre}" 
                                th:selected="${departamentoSeleccionado == d.id}"></option>
                    </select>
                </form>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/empleados/nuevo}" class="btn btn-primary">+ Nuevo Empleado</a>
            </div>
        </div>

        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Nombre</th>
                    <th>Cédula</th>
                    <th>Email</th>
                    <th>Puesto</th>
                    <th>Salario</th>
                    <th>Fecha Ingreso</th>
                    <th>Departamento</th>
                    <th sec:authorize="hasRole('ADMIN')">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="e : ${empleados}">
                    <td th:text="${e.nombre}"></td>
                    <td th:text="${e.cedula}"></td>
                    <td th:text="${e.email}"></td>
                    <td th:text="${e.puesto.etiqueta}"></td>
                    <td th:text="${#numbers.formatDecimal(e.salario, 1, 2)}"></td>
                    <!-- Formato de fecha  -->
                    <td th:text="${#temporals.format(e.fechaIngreso, 'dd/MM/yyyy')}"></td>
                    <td th:text="${e.departamento.nombre}"></td>
                    <td sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/empleados/{id}/editar(id=${e.id})}" class="btn btn-sm btn-warning">Editar</a>
                        <form th:action="@{/empleados/{id}/eliminar(id=${e.id})}" method="post" class="d-inline" onsubmit="return confirm('¿Seguro que deseas eliminar este empleado?');">
                            <button class="btn btn-sm btn-danger">Eliminar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        <div th:if="${#lists.isEmpty(empleados)}" class="alert alert-info text-center">No hay empleados registrados.</div>
    </div>
</body>
</html>

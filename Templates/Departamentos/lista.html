<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Departamentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand">Departamentos</span>
        <div>
            <a th:href="@{/}" class="btn btn-outline-light btn-sm">Inicio</a>
            <a th:href="@{/empleados}" class="btn btn-outline-light btn-sm">Empleados</a>
            <form th:action="@{/logout}" method="post" class="d-inline"><button class="btn btn-danger btn-sm">Salir</button></form>
        </div>
    </nav>

    <div class="container mt-4">
        
        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="d-flex justify-content-between mb-3">
            <h3>Lista de Departamentos</h3>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/departamentos/nuevo}" class="btn btn-primary">+ Nuevo Departamento</a>
        </div>

        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Nombre</th>
                    <th>Ubicación</th>
                    <th>Presupuesto</th>
                    <th>Empleados</th>
                    <th>Planilla (Total salarios)</th>
                    <th>Disponible</th>
                    <th sec:authorize="hasRole('ADMIN')">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="d : ${departamentos}">
                    <td th:text="${d.nombre}"></td>
                    <td th:text="${d.ubicacion}"></td>
                    <td th:text="${#numbers.formatDecimal(d.presupuesto, 1, 2)}"></td>
                    <!--  filtra empleados por este depto -->
                    <td>
                        <a th:href="@{/empleados(departamentoId=${d.id})}" th:text="${d.empleados.size()}" class="badge bg-info text-dark text-decoration-none"></a>
                    </td>
                    
                    <td th:text="${#numbers.formatDecimal(#aggregates.sum(d.empleados.![salario]), 1, 2)}"></td>
                    <td th:text="${#numbers.formatDecimal(d.presupuesto - #aggregates.sum(d.empleados.![salario]), 1, 2)}"></td>
                    
                    <td sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/departamentos/{id}/editar(id=${d.id})}" class="btn btn-sm btn-warning">Editar</a>
                        <form th:action="@{/departamentos/{id}/eliminar(id=${d.id})}" method="post" class="d-inline" onsubmit="return confirm('¿Seguro que deseas eliminar este departamento?');">
                            <button class="btn btn-sm btn-danger">Eliminar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        <div th:if="${#lists.isEmpty(departamentos)}" class="alert alert-info text-center">No hay departamentos registrados.</div>
    </div>
</body>
</html>

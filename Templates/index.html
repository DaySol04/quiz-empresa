<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Inicio - Empresa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand">Sistema de Empresa</span>
        <div>
            <!-- Solo el ADMIN ve este botón -->
            <a th:href="@{/usuarios}" sec:authorize="hasRole('ADMIN')" class="btn btn-outline-light btn-sm">Usuarios</a>
            <a th:href="@{/departamentos}" class="btn btn-outline-light btn-sm">Departamentos</a>
            <a th:href="@{/empleados}" class="btn btn-outline-light btn-sm">Empleados</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button class="btn btn-danger btn-sm">Cerrar Sesión</button>
            </form>
        </div>
    </nav>

    <div class="container mt-5 text-center">
        <h1>¡Bienvenido al Sistema!</h1>
        <p>Usa el menú superior para navegar por los departamentos y empleados.</p>
        <h5 class="text-muted mt-4">Logueado como: <span sec:authentication="name"></span></p></h5>
    </div>
</body>
</html>

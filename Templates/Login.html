<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 400px;">
    <div class="card shadow">
        <div class="card-body p-4">
            <h3 class="text-center mb-4">Iniciar sesión</h3>
            <div th:if="${param.error}" class="alert alert-danger">Usuario o contraseña incorrectos</div>
            <div th:if="${param.logout}" class="alert alert-success">Has cerrado sesión</div>
            
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>
            <p class="text-muted small mt-3 mb-0 text-center">Admin: <b>admin/admin123</b> | User: <b>user/user123</b></p>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow">
        <div class="card-body p-4">
            <h4 th:text="${usuario.id == null ? 'Nuevo Usuario' : 'Editar Usuario'}"></h4>
            
            <form th:object="${usuario}" method="post" 
                  th:action="${usuario.id == null} ? @{/usuarios/guardar} : @{/usuarios/{id}/actualizar(id=${usuario.id})}">
                
                <div class="mb-3">
                    <label class="form-label">Nombre de Usuario (Username)</label>
                    <input type="text" th:field="*{username}" class="form-control" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" th:field="*{password}" class="form-control">
                    <div class="form-text" th:if="${usuario.id != null}">Déjala vacía si no deseas cambiarla.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Rol</label>
                    <select th:field="*{rol}" class="form-select" required>
                        <option value="USER">USER (Cliente)</option>
                        <option value="ADMIN">ADMIN (Administrador)</option>
                    </select>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a th:href="@{/usuarios}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>

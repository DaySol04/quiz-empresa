<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand">Usuarios (Solo Admin)</span>
        <div>
            <a th:href="@{/}" class="btn btn-outline-light btn-sm">Inicio</a>
            <a th:href="@{/departamentos}" class="btn btn-outline-light btn-sm">Departamentos</a>
            <a th:href="@{/empleados}" class="btn btn-outline-light btn-sm">Empleados</a>
            <form th:action="@{/logout}" method="post" class="d-inline"><button class="btn btn-danger btn-sm">Salir</button></form>
        </div>
    </nav>

    <div class="container mt-4">
        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="d-flex justify-content-between mb-3">
            <h3>Lista de Usuarios</h3>
            <a th:href="@{/usuarios/nuevo}" class="btn btn-primary">+ Nuevo Usuario</a>
        </div>

        <table class="table table-striped align-middle">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Rol</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="u : ${usuarios}">
                    <td th:text="${u.id}"></td>
                    <td th:text="${u.username}"></td>
                    <td>
                        <span class="badge" th:classappend="${u.rol == 'ADMIN'} ? 'bg-danger' : 'bg-secondary'" th:text="${u.rol}"></span>
                    </td>
                    <td>
                        <a th:href="@{/usuarios/{id}/editar(id=${u.id})}" class="btn btn-sm btn-warning">Editar</a>
                        <form th:action="@{/usuarios/{id}/eliminar(id=${u.id})}" method="post" class="d-inline" onsubmit="return confirm('¿Seguro que deseas eliminar este usuario?');">
                            <button class="btn btn-sm btn-danger">Eliminar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>

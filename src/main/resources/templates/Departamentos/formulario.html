<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Departamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow">
        <div class="card-body p-4">
            <h4 th:text="${departamento.id == null ? 'Nuevo Departamento' : 'Editar Departamento'}"></h4>
            
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            
            <form th:object="${departamento}" method="post" 
                  th:action="${departamento.id == null} ? @{/departamentos/guardar} : @{/departamentos/{id}/actualizar(id=${departamento.id})}">
                
                <div class="mb-3">
                    <label class="form-label">Nombre del Departamento</label>
                    <input type="text" th:field="*{nombre}" class="form-control" th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{nombre}"></div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Ubicación</label>
                    <input type="text" th:field="*{ubicacion}" class="form-control" th:classappend="${#fields.hasErrors('ubicacion')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{ubicacion}"></div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Presupuesto</label>
                    <input type="number" step="0.01" th:field="*{presupuesto}" class="form-control" th:classappend="${#fields.hasErrors('presupuesto')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{presupuesto}"></div>
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/departamentos}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
